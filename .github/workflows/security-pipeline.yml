
name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit semgrep pip-audit

      - name: Create reports directory
        run: mkdir -p reports && chmod 777 reports

      - name: Bandit
        continue-on-error: true
        run: bandit -r app/ -f json -o reports/bandit-report.json

      - name: Semgrep
        continue-on-error: true
        run: semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json app/

      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -f json -o reports/dependency-report.json

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Verify setuptools version inside Docker image
        run: |
          docker run --rm vulnfinbot:latest python -c "import setuptools; print('Installed setuptools:', setuptools.__version__); assert setuptools.__version__ >= '78.1.1', 'Vulnerable setuptools version detected'"

      - name: Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/reports:/reports" \
            aquasec/trivy:latest image \
            --format json --output /reports/trivy-report.json vulnfinbot:latest

      - name: Start application container
        run: |
          docker run -d --name vulnfinbot -p 5000:5000 vulnfinbot:latest
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && break || sleep 1
          done

      - name: OWASP ZAP baseline scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -J zap-report.json -I

      - name: Stop application container
        if: always()
        run: docker rm -f vulnfinbot || true

      - name: AI security tests and report
        continue-on-error: true
        run: |
          pytest tests/test_ai_security.py -v
          python -m security.ai_report

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
